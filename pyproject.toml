# Tool config for every Python file in the repo. Each service directory is a
# standalone script plus its test, not a package.

[tool.ruff]
line-length = 120
target-version = "py313" # the images' Python

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",    # annotations: mypy --strict enforces them
    "D",      # docstrings: module/function comments carry the why
    "COM812", # trailing commas: the formatter owns these
    "CPY",    # no copyright headers
    "INP001", # service dirs are deliberately not packages
    "S310",   # urlopen: URLs are constants, bar offline_tiles --tile-url (checked https://)
    "T201",   # print is the logging for these small services
]

[tool.ruff.lint.per-file-ignores]
# Tests are plain assert scripts run as `python3 test_x.py`, not pytest, and
# their fakes mirror real signatures and calls.
"test_*.py" = ["S101", "PLR2004", "PT", "E402", "SLF001", "ARG", "FBT003", "EM", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.13"
# Tests import their service as a top-level module from its own directory.
mypy_path = "healer:hub:ogn-bridge:scripts:status:tiles"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "ogn.*" # ogn-client ships no type information
ignore_missing_imports = true

[tool.coverage.run]
branch = true
omit = ["test_*.py"]

[tool.coverage.report]
fail_under = 100
# The entrypoint guard only calls main(), which the tests cover directly.
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
