version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by digest; this keeps the digests current.
  - package-ecosystem: docker
    directories: [/healer, /hub, /ogn, /ogn-bridge, /status, /stream-compress]
    schedule:
      interval: weekly
