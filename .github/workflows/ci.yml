name: CI

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./ogn --build-arg BINARY=ogn-rf -t ogn-rf-ci
      - run: docker build ./ogn --build-arg BINARY=ogn-decode -t ogn-decode-ci
      - run: docker build ./ogn-bridge -t ogn-bridge-ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy.sh harden-host.sh systemd/install.sh ogn/entrypoint.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff==0.16.8
      - run: ruff check ogn-bridge/bridge.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
