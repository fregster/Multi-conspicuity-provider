name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          cp .env.example .env
          ./init-uuids.sh
          docker compose config >/dev/null

  # File types, ruff.toml + test per Python dir, shellcheck, ruff, every image
  # built, and every test_*.sh / test_*.py run (Python ones inside their
  # service's image) - all discovered by check.sh, so new files are covered
  # without editing this workflow.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --only-binary ':all:' ruff==0.16.8
      - run: ./check.sh
      # ogn builds two images from one Dockerfile; check.sh covers the default.
      - run: docker build ./ogn --build-arg BINARY=ogn-decode -t ogn-decode-ci

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true
          config: .hadolint.yaml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
