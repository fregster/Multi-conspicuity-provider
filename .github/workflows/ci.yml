name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./ogn --build-arg BINARY=ogn-rf -t ogn-rf-ci
      - run: docker build ./ogn --build-arg BINARY=ogn-decode -t ogn-decode-ci
      - run: docker build ./ogn-bridge -t ogn-bridge-ci
      - run: docker build ./status -t status-ci
      - name: Bridge tests
        run: docker run --rm -v "$PWD/ogn-bridge:/t:ro" -w /t --entrypoint python3 ogn-bridge-ci test_bridge.py
      - name: Status tests
        run: docker run --rm -v "$PWD/status:/t:ro" -w /t --entrypoint python3 status-ci test_status.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy.sh harden-host.sh systemd/install.sh ogn/entrypoint.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --only-binary ':all:' ruff==0.16.8
      - run: ruff check ogn-bridge/ status/
      - run: ruff format --check ogn-bridge/ status/

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ogn/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ogn-bridge/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: status/Dockerfile
          config: .hadolint.yaml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
