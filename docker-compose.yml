# Shared hardening. Every service drops all capabilities and can't gain new
# privileges; anything that needs more adds it back explicitly.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Host search domains have wildcard records, so any failed lookup (e.g. a
  # stopped container's name, or glibc's AAAA-first query for a compose service
  # name) falls through to them and resolves to a public IP. Seen breaking
  # traefik->socket-proxy, fr24feed, and adsbhub's healthcheck/uplink.
  dns_search: .

# sdr-enthusiasts images start s6-overlay as root and drop to nobody/www-data
# themselves, so some add caps back. Each list is the measured minimum (a
# leave-one-out test per cap on the Pi); re-test after image updates:
#   SETGID       s6-applyuidgid setgroups()
#   SETUID       s6-applyuidgid / nginx / lighttpd dropping to a service user
#   CHOWN        startup chowns of log/state dirs
#   DAC_OVERRIDE piaware's root tee into its nobody-owned log dir
#   KILL         piaware: s6 signalling non-root children (else stop hangs 10s)

services:
  # Reverse proxy for external access to tar1090 over HTTPS. TLS is enabled
  # with no cert resolver configured, so Traefik falls back to its own
  # auto-generated self-signed certificate - browsers will warn once, no
  # domain or ACME setup required. Swap in a real certresolver later if you
  # want a trusted cert instead.
  traefik:
    <<: *hardened
    image: traefik:v3.7
    container_name: traefik
    user: "65534:65534"
    read_only: true
    depends_on:
      - socket-proxy
    networks:
      - proxy
      - docker-api
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.network=mcp-proxy
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"

  # Read-only, container-listing-only view of the Docker API for Traefik, on
  # an internal network - so a compromised Traefik doesn't get host root.
  socket-proxy:
    <<: *hardened
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - docker-api
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Static holding page at "/" linking to every service's path - otherwise
  # the root of the site 404s, since every other router matches a subpath.
  landing:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:alpine
    container_name: landing
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - proxy
    volumes:
      # Whole directory, not the file: deploy.sh's rsync replaces index.html,
      # and a single-file bind mount would keep serving the old inode.
      - ./landing:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=PathPrefix(`/`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls=true"
      # Explicit low priority so this catch-all never shadows the more
      # specific per-service path routers, regardless of rule-length.
      - "traefik.http.routers.landing.priority=1"
      - "traefik.http.services.landing.loadbalancer.server.port=8080"

  # --- ADS-B (1090MHz) ---------------------------------------------------
  # Decodes 1090MHz ADS-B, serves the local tar1090 map, and feeds adsb.lol
  # and adsb.fi directly (no separate container needed for either network).
  ultrafeeder:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:${ULTRAFEEDER_TAG:-latest}
    container_name: ultrafeeder
    hostname: ultrafeeder
    networks:
      - proxy
      - adsb
    device_cgroup_rules:
      - "c 189:* rwm"
    ports:
      - "${TAR1090_PORT:-8080}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tar1090.rule=PathPrefix(`/tar1090`)"
      - "traefik.http.routers.tar1090.entrypoints=websecure"
      - "traefik.http.routers.tar1090.tls=true"
      - "traefik.http.routers.tar1090.middlewares=tar1090-strip"
      - "traefik.http.middlewares.tar1090-strip.stripprefix.prefixes=/tar1090"
      - "traefik.http.services.tar1090.loadbalancer.server.port=80"
    environment:
      - TZ=${TZ:-UTC}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_GAIN=auto
      - READSB_RTLSDR_DEVICE=${SDR_1090_SERIAL}
      - READSB_RTLSDR_PPM=${SDR_1090_PPM:-0}
      - READSB_LAT=${STATION_LAT}
      - READSB_LON=${STATION_LON}
      - READSB_ALT=${STATION_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - UUID=${ADSBLOL_UUID}
      - MLAT_USER=${STATION_NAME}
      - &ultrafeeder-config ULTRAFEEDER_CONFIG=adsb,in.adsb.lol,30004,beast_reduce_plus_out,uuid=${ADSBLOL_UUID};mlat,in.adsb.lol,31090,uuid=${ADSBLOL_UUID};adsb,feed.adsb.fi,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090;adsb,feed.airplanes.live,30004,beast_reduce_plus_out;mlat,feed.airplanes.live,31090;adsb,feed.planespotters.net,30004,beast_reduce_plus_out;mlat,mlat.planespotters.net,31090;adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;mlat,feed.adsbexchange.com,31090;adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;mlat,feed.theairtraffic.com,31090
      - TAR1090_PAGETITLE=${STATION_NAME}
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_SITESHOW=true
      - UPDATE_TAR1090=true
    volumes:
      - ultrafeeder_globe_history:/var/globe_history
      - ultrafeeder_graphs:/var/lib/collectd
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M

  # Feeds PiAware/FlightAware from ultrafeeder's Beast output - no SDR of its own.
  piaware:
    <<: *hardened
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    image: ghcr.io/sdr-enthusiasts/docker-piaware:${PIAWARE_TAG:-latest}
    container_name: piaware
    networks:
      - proxy
      - adsb
    depends_on:
      - ultrafeeder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.piaware.rule=PathPrefix(`/piaware`)"
      - "traefik.http.routers.piaware.entrypoints=websecure"
      - "traefik.http.routers.piaware.tls=true"
      - "traefik.http.routers.piaware.middlewares=piaware-strip"
      - "traefik.http.middlewares.piaware-strip.stripprefix.prefixes=/piaware"
      - "traefik.http.services.piaware.loadbalancer.server.port=80"
    environment:
      - TZ=${TZ:-UTC}
      - RECEIVER_TYPE=relay
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - FEEDER_ID=${PIAWARE_FEEDER_ID}

  # Feeds ADSBHub from ultrafeeder's SBS output - no SDR of its own.
  adsbhub:
    <<: *hardened
    cap_add:
      - SETGID
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub:${ADSBHUB_TAG:-latest}
    container_name: adsbhub
    networks:
      - adsb
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-UTC}
      - SBSHOST=ultrafeeder
      - CLIENTKEY=${ADSBHUB_CLIENTKEY}

  # Feeds FlightRadar24 from ultrafeeder's Beast output - no SDR of its own.
  fr24feed:
    <<: *hardened
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:${FR24_TAG:-latest}
    container_name: fr24feed
    networks:
      - proxy
      - adsb
    depends_on:
      - ultrafeeder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fr24feed.rule=PathPrefix(`/fr24feed`)"
      - "traefik.http.routers.fr24feed.entrypoints=websecure"
      - "traefik.http.routers.fr24feed.tls=true"
      - "traefik.http.routers.fr24feed.middlewares=fr24feed-strip"
      - "traefik.http.middlewares.fr24feed-strip.stripprefix.prefixes=/fr24feed"
      - "traefik.http.services.fr24feed.loadbalancer.server.port=8754"
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - FR24KEY=${FR24_SHARING_KEY}
      - MLAT=yes

  # Feeds RadarBox/AirNav Radar from ultrafeeder's Beast output - no SDR of its own.
  radarbox:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar:${AIRNAVRADAR_TAG:-latest}
    container_name: radarbox
    networks:
      - adsb
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTPORT=31004
      - LAT=${STATION_LAT}
      - LONG=${STATION_LON}
      - ALT=${STATION_ALT_M}
      - SHARING_KEY=${RADARBOX_SHARING_KEY}

  # Feeds OpenSky Network from ultrafeeder's Beast output - no SDR of its own.
  opensky:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:${OPENSKY_TAG:-latest}
    container_name: opensky
    networks:
      - adsb
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - LAT=${STATION_LAT}
      - LONG=${STATION_LON}
      - ALT=${STATION_ALT_M}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME}
      - OPENSKY_SERIAL=${OPENSKY_SERIAL}

  # Feeds PlaneFinder from ultrafeeder's Beast output - no SDR of its own.
  planefinder:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: ghcr.io/sdr-enthusiasts/docker-planefinder:${PLANEFINDER_TAG:-latest}
    container_name: planefinder
    networks:
      - proxy
      - adsb
    depends_on:
      - ultrafeeder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.planefinder.rule=PathPrefix(`/planefinder`)"
      - "traefik.http.routers.planefinder.entrypoints=websecure"
      - "traefik.http.routers.planefinder.tls=true"
      - "traefik.http.routers.planefinder.middlewares=planefinder-strip"
      - "traefik.http.middlewares.planefinder-strip.stripprefix.prefixes=/planefinder"
      - "traefik.http.services.planefinder.loadbalancer.server.port=30053"
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - LAT=${STATION_LAT}
      - LONG=${STATION_LON}
      - SHARECODE=${PLANEFINDER_SHARECODE}

  # Puts FLARM/OGN traffic on tar1090 via ultrafeeder's SBS input: our own SDR
  # (ogn-decode logs in here as its "APRS server", so it works with no internet;
  # positions are relayed on to aprs.glidernet.org when online) plus the wider
  # OGN network when reachable, de-duplicated in favour of the local SDR. See
  # ogn-bridge/bridge.py.
  ogn-bridge:
    <<: *hardened
    build: ./ogn-bridge
    container_name: ogn-bridge
    read_only: true
    networks:
      - adsb
      - ogn
    depends_on:
      - ultrafeeder
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - OGN_RANGE_KM=${OGN_RANGE_KM:-150}
      - SBS_HOST=ultrafeeder
      - SBS_PORT=32006

  # --- FLARM/OGN (868.8MHz) -----------------------------------------------
  # Split decoder pattern: ogn-rf owns the SDR and streams spectra to
  # ogn-decode over TCP 50010, which pushes positions to ogn-bridge (which
  # shows them on tar1090 and relays them on to aprs.glidernet.org).
  ogn-rf:
    <<: *hardened
    build:
      context: ./ogn
      args:
        BINARY: ogn-rf
    container_name: ogn-rf
    hostname: ogn-rf
    read_only: true
    # Both OGN binaries read console commands from stdin and exit(0) the
    # moment it hits EOF - which is what they get from Docker's /dev/null.
    # Without this they start fully (SDR opens, APRS login accepted), then
    # quit after ~5s and restart forever. Keeps stdin an open, empty pipe.
    stdin_open: true
    tmpfs:
      - /ogn
    networks:
      - proxy
      - ogn
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogn-rf.rule=PathPrefix(`/ogn-rf`)"
      - "traefik.http.routers.ogn-rf.entrypoints=websecure"
      - "traefik.http.routers.ogn-rf.tls=true"
      - "traefik.http.routers.ogn-rf.middlewares=ogn-rf-strip"
      - "traefik.http.middlewares.ogn-rf-strip.stripprefix.prefixes=/ogn-rf"
      - "traefik.http.services.ogn-rf.loadbalancer.server.port=8080"
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - STATION_ALT_M=${STATION_ALT_M}
      - SDR_FLARM_PPM=${SDR_FLARM_PPM:-0}
      - SDR_FLARM_SERIAL=${SDR_FLARM_SERIAL}
      - OGN_CALLSIGN=${OGN_CALLSIGN}
    ports:
      - "${OGN_RF_STATUS_PORT:-8081}:8080"

  ogn-decode:
    <<: *hardened
    build:
      context: ./ogn
      args:
        BINARY: ogn-decode
    container_name: ogn-decode
    user: "65534:65534"
    read_only: true
    stdin_open: true # see ogn-rf
    tmpfs:
      - /ogn:uid=65534,gid=65534
    networks:
      - proxy
      - ogn
    depends_on:
      - ogn-rf
      - ogn-bridge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogn-decode.rule=PathPrefix(`/ogn-decode`)"
      - "traefik.http.routers.ogn-decode.entrypoints=websecure"
      - "traefik.http.routers.ogn-decode.tls=true"
      - "traefik.http.routers.ogn-decode.middlewares=ogn-decode-strip"
      - "traefik.http.middlewares.ogn-decode-strip.stripprefix.prefixes=/ogn-decode"
      - "traefik.http.services.ogn-decode.loadbalancer.server.port=8081"
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - STATION_ALT_M=${STATION_ALT_M}
      - SDR_FLARM_PPM=${SDR_FLARM_PPM:-0}
      - OGN_CALLSIGN=${OGN_CALLSIGN}
    ports:
      - "${OGN_DECODE_STATUS_PORT:-8082}:8081"

  # /status.json for the landing page: container health (via the read-only
  # socket-proxy), per-aggregator ADS-B feed status from ultrafeeder, and OGN
  # link health from ogn-bridge. See status/status.py.
  status:
    <<: *hardened
    build: ./status
    container_name: status
    read_only: true
    depends_on:
      - socket-proxy
    networks:
      - proxy
      - adsb
      - docker-api
    environment:
      - *ultrafeeder-config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.status.rule=Path(`/status.json`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.tls=true"
      - "traefik.http.services.status.loadbalancer.server.port=8080"

volumes:
  ultrafeeder_globe_history:
  ultrafeeder_graphs:

networks:
  # Traefik <-> web UIs. Fixed name so Traefik's docker.network flag matches.
  proxy:
    name: mcp-proxy
  # ultrafeeder <-> feeders and the OGN bridge.
  adsb:
  # ogn-rf <-> ogn-decode spectra stream, and ogn-decode -> ogn-bridge positions.
  ogn:
  # Traefik <-> socket-proxy only; no route out.
  docker-api:
    internal: true
