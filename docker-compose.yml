services:
  # Reverse proxy for external access to tar1090 over HTTPS. TLS is enabled
  # with no cert resolver configured, so Traefik falls back to its own
  # auto-generated self-signed certificate - browsers will warn once, no
  # domain or ACME setup required. Swap in a real certresolver later if you
  # want a trusted cert instead.
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      # NOTE: `:ro` only stops writes to the socket file itself - it does not
      # restrict what API calls Traefik can make over it. Full Docker API
      # access (equivalent to host root) is still possible if this container
      # is ever compromised. Put a docker-socket-proxy in front of this
      # during the system-hardening pass to actually restrict it to reads.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Static holding page at "/" linking to every service's path - otherwise
  # the root of the site 404s, since every other router matches a subpath.
  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=PathPrefix(`/`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls=true"
      # Explicit low priority so this catch-all never shadows the more
      # specific per-service path routers, regardless of rule-length.
      - "traefik.http.routers.landing.priority=1"
      - "traefik.http.services.landing.loadbalancer.server.port=80"

  # --- ADS-B (1090MHz) ---------------------------------------------------
  # Decodes 1090MHz ADS-B, serves the local tar1090 map, and feeds adsb.lol
  # and adsb.fi directly (no separate container needed for either network).
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    container_name: ultrafeeder
    hostname: ultrafeeder
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    ports:
      - "${TAR1090_PORT:-8080}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tar1090.rule=PathPrefix(`/tar1090`)"
      - "traefik.http.routers.tar1090.entrypoints=websecure"
      - "traefik.http.routers.tar1090.tls=true"
      - "traefik.http.routers.tar1090.middlewares=tar1090-strip"
      - "traefik.http.middlewares.tar1090-strip.stripprefix.prefixes=/tar1090"
      - "traefik.http.services.tar1090.loadbalancer.server.port=80"
    environment:
      - TZ=${TZ:-UTC}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_GAIN=auto
      - READSB_RTLSDR_DEVICE=${SDR_1090_SERIAL}
      - READSB_RTLSDR_PPM=${SDR_1090_PPM:-0}
      - READSB_LAT=${STATION_LAT}
      - READSB_LON=${STATION_LON}
      - READSB_ALT=${STATION_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - UUID=${ADSBLOL_UUID}
      - MLAT_USER=${STATION_NAME}
      - ULTRAFEEDER_CONFIG=adsb,in.adsb.lol,30004,beast_reduce_plus_out,uuid=${ADSBLOL_UUID};mlat,in.adsb.lol,31090,uuid=${ADSBLOL_UUID};adsb,feed.adsb.fi,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090;adsb,feed.airplanes.live,30004,beast_reduce_plus_out;mlat,feed.airplanes.live,31090;adsb,feed.planespotters.net,30004,beast_reduce_plus_out;mlat,mlat.planespotters.net,31090;adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;mlat,feed.adsbexchange.com,31090
      - TAR1090_PAGETITLE=${STATION_NAME}
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_SITESHOW=true
      - UPDATE_TAR1090=true
    volumes:
      - ultrafeeder_globe_history:/var/globe_history
      - ultrafeeder_graphs:/var/lib/collectd
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M

  # Feeds PiAware/FlightAware from ultrafeeder's Beast output - no SDR of its own.
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware
    container_name: piaware
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.piaware.rule=PathPrefix(`/piaware`)"
      - "traefik.http.routers.piaware.entrypoints=websecure"
      - "traefik.http.routers.piaware.tls=true"
      - "traefik.http.routers.piaware.middlewares=piaware-strip"
      - "traefik.http.middlewares.piaware-strip.stripprefix.prefixes=/piaware"
      - "traefik.http.services.piaware.loadbalancer.server.port=80"
    environment:
      - TZ=${TZ:-UTC}
      - RECEIVER_TYPE=relay
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - FEEDER_ID=${PIAWARE_FEEDER_ID}

  # Feeds ADSBHub from ultrafeeder's SBS output - no SDR of its own.
  adsbhub:
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub
    container_name: adsbhub
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-UTC}
      - SBSHOST=ultrafeeder
      - CLIENTKEY=${ADSBHUB_CLIENTKEY}

  # Feeds FlightRadar24 from ultrafeeder's Beast output - no SDR of its own.
  fr24feed:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24
    container_name: fr24feed
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    dns_search: . # works around a docker/fr24feed bug with connection issues
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fr24feed.rule=PathPrefix(`/fr24feed`)"
      - "traefik.http.routers.fr24feed.entrypoints=websecure"
      - "traefik.http.routers.fr24feed.tls=true"
      - "traefik.http.routers.fr24feed.middlewares=fr24feed-strip"
      - "traefik.http.middlewares.fr24feed-strip.stripprefix.prefixes=/fr24feed"
      - "traefik.http.services.fr24feed.loadbalancer.server.port=8754"
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - FR24KEY=${FR24_SHARING_KEY}
      - MLAT=yes

  # Feeds RadarBox/AirNav Radar from ultrafeeder's Beast output - no SDR of its own.
  radarbox:
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar
    container_name: radarbox
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTPORT=31004
      - LAT=${STATION_LAT}
      - LONG=${STATION_LON}
      - ALT=${STATION_ALT_M}
      - SHARING_KEY=${RADARBOX_SHARING_KEY}

  # Feeds PlaneFinder from ultrafeeder's Beast output - no SDR of its own.
  planefinder:
    image: ghcr.io/sdr-enthusiasts/docker-planefinder
    container_name: planefinder
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.planefinder.rule=PathPrefix(`/planefinder`)"
      - "traefik.http.routers.planefinder.entrypoints=websecure"
      - "traefik.http.routers.planefinder.tls=true"
      - "traefik.http.routers.planefinder.middlewares=planefinder-strip"
      - "traefik.http.middlewares.planefinder-strip.stripprefix.prefixes=/planefinder"
      - "traefik.http.services.planefinder.loadbalancer.server.port=30053"
    environment:
      - TZ=${TZ:-UTC}
      - BEASTHOST=ultrafeeder
      - LAT=${STATION_LAT}
      - LONG=${STATION_LON}
      - SHARECODE=${PLANEFINDER_SHARECODE}

  # Bridges nearby OGN network traffic (not just our own dongle - see
  # ogn-bridge/bridge.py) into ultrafeeder's SBS input, so tar1090 shows
  # FLARM/OGN traffic on the same map as ADS-B.
  ogn-bridge:
    build: ./ogn-bridge
    container_name: ogn-bridge
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - OGN_RANGE_KM=${OGN_RANGE_KM:-150}
      - SBS_HOST=ultrafeeder
      - SBS_PORT=32006

  # --- FLARM/OGN (868.8MHz) -----------------------------------------------
  # Split decoder pattern: ogn-rf owns the SDR and streams spectra to
  # ogn-decode over TCP 50010, which pushes positions to aprs.glidernet.org.
  ogn-rf:
    build:
      context: ./ogn
      args:
        BINARY: ogn-rf
    container_name: ogn-rf
    hostname: ogn-rf
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogn-rf.rule=PathPrefix(`/ogn-rf`)"
      - "traefik.http.routers.ogn-rf.entrypoints=websecure"
      - "traefik.http.routers.ogn-rf.tls=true"
      - "traefik.http.routers.ogn-rf.middlewares=ogn-rf-strip"
      - "traefik.http.middlewares.ogn-rf-strip.stripprefix.prefixes=/ogn-rf"
      - "traefik.http.services.ogn-rf.loadbalancer.server.port=8080"
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - STATION_ALT_M=${STATION_ALT_M}
      - SDR_FLARM_PPM=${SDR_FLARM_PPM:-0}
      - SDR_FLARM_SERIAL=${SDR_FLARM_SERIAL}
      - OGN_CALLSIGN=${OGN_CALLSIGN}
    ports:
      - "${OGN_RF_STATUS_PORT:-8081}:8080"

  ogn-decode:
    build:
      context: ./ogn
      args:
        BINARY: ogn-decode
    container_name: ogn-decode
    restart: unless-stopped
    depends_on:
      - ogn-rf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogn-decode.rule=PathPrefix(`/ogn-decode`)"
      - "traefik.http.routers.ogn-decode.entrypoints=websecure"
      - "traefik.http.routers.ogn-decode.tls=true"
      - "traefik.http.routers.ogn-decode.middlewares=ogn-decode-strip"
      - "traefik.http.middlewares.ogn-decode-strip.stripprefix.prefixes=/ogn-decode"
      - "traefik.http.services.ogn-decode.loadbalancer.server.port=8081"
    environment:
      - STATION_LAT=${STATION_LAT}
      - STATION_LON=${STATION_LON}
      - STATION_ALT_M=${STATION_ALT_M}
      - SDR_FLARM_PPM=${SDR_FLARM_PPM:-0}
      - OGN_CALLSIGN=${OGN_CALLSIGN}
    ports:
      - "${OGN_DECODE_STATUS_PORT:-8082}:8081"

volumes:
  ultrafeeder_globe_history:
  ultrafeeder_graphs:
